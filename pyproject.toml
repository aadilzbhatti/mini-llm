[project]
name = "mini-llm"
version = "0.1.0"
description = "Minimal local training environment for a hand-written decoder-only Transformer."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Aadil Bhatti", email = "aadilzbhatti@gmail.com" }]
dependencies = [
    "torch>=2.14",
    "transformers>=4.49",
    "datasets>=3.0",
    "matplotlib>=3.8",
    "tensorboard>=2.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
mini-llm-train = "mini_llm.train:main"
mini-llm-generate = "mini_llm.generate:main"
mini-llm-prepare-data = "mini_llm.prepare_dataset:main"
mini-llm-control = "mini_llm.server:main"
mini-llm-import-run = "mini_llm.import_run:main"
mini-llm-eval = "mini_llm.evals:main"
mini-llm-bench = "mini_llm.bench:main"
mini-llm-samples = "mini_llm.samples:main"
mini-llm-modal-mirror = "mini_llm.remote.modal_mirror:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Only for launching remote runs: `uv run --group modal modal run ...` (see README).
modal = ["modal>=1.5.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120

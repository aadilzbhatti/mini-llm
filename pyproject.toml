[project]
name = "mini-llm"
version = "0.1.0"
description = "Minimal local training environment for a hand-written decoder-only Transformer."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Aadil Bhatti", email = "aadilzbhatti@gmail.com" }]
dependencies = [
    "torch>=2.14",
    "transformers>=4.49",
]

[project.scripts]
mini-llm-train = "mini_llm.train:main"
mini-llm-generate = "mini_llm.generate:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autolab Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --band: rgba(42,120,214,0.10);
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --band: rgba(57,135,229,0.16);
    --good-ink: #0ca30c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --band: rgba(57,135,229,0.16);
  --good-ink: #0ca30c;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--border); }
.bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar h1 { font-size: 16px; margin: 0; font-weight: 650; }
.back { color: var(--ink-2); text-decoration: none; border: 1px solid var(--border); border-radius: 8px; padding: 3px 9px; font-size: 13px; }
.back:hover { color: var(--ink); border-color: var(--axis); }
.budget form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-top: 8px; }
.budget label { display: flex; flex-direction: column; font-size: 12px; color: var(--ink-2); gap: 3px; }
.budget input { font: inherit; width: 110px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
.budget button, .btn, .card .row button { font: inherit; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.pri { background: var(--s1); border-color: var(--s1); color: #fff; }
.bar .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
nav { max-width: 1200px; margin: 0 auto; padding: 0 16px 8px; display: flex; gap: 4px; overflow-x: auto; }
nav button { border: 1px solid transparent; background: none; color: var(--ink-2); padding: 6px 10px;
  border-radius: 8px; font: inherit; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { background: var(--surface); border-color: var(--border); color: var(--ink); font-weight: 600; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
section[hidden] { display: none; }
.card p, .tile .sub { overflow-wrap: anywhere; }
h2 { font-size: 15px; margin: 22px 0 10px; font-weight: 650; }
h3 { font-size: 14px; margin: 0 0 6px; font-weight: 650; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.tile .label { color: var(--ink-2); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 650; margin-top: 2px; }
.tile .sub { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; display: flex; gap: 2px; }
.meter > span { display: block; height: 100%; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.status i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.muted { color: var(--muted); }
.ink2 { color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 14px; }
.grid2 > * { min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface-2); }
th.sort { cursor: pointer; user-select: none; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--surface-2);
  border: 1px solid var(--border); font-size: 12px; margin: 2px 4px 2px 0; white-space: nowrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
select, input[type=search] { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); }
code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-2); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--surface-2); border-radius: 8px; padding: 10px; overflow: auto; font-size: 12px; max-height: 360px; margin: 0; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--s1); }
.chart { position: relative; }
.chart svg { display: block; max-width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .lbl { fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); white-space: nowrap; z-index: 3; }
.tip b { font-variant-numeric: tabular-nums; }
.tip .key { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 4px 0 6px; }
.legend .key { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 6px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--page); color: var(--ink);
  width: min(1000px, calc(100vw - 16px)); max-height: calc(100vh - 32px); padding: 0; }
dialog::backdrop { background: rgba(0,0,0,0.4); }
dialog .head { position: sticky; top: 0; background: var(--page); padding: 12px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; }
dialog .body { padding: 16px; }
dialog .head button { margin-left: auto; font: inherit; border: 1px solid var(--border); background: var(--surface);
  color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
a { color: var(--s1); }
.decision { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.decision .when { color: var(--muted); font-size: 12px; }
.label-diag { font-weight: 600; }
.stale { opacity: 0.55; transition: opacity .2s; }
.now { display: flex; gap: 12px; align-items: flex-start; }
.now .pulse { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; flex: none; background: var(--good); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .now .pulse { animation: none; } }
.now .what { font-size: 16px; font-weight: 600; }
.board { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border-radius: 12px; padding: 8px; min-height: 120px; }
.col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2); margin: 2px 4px 8px; display: flex; justify-content: space-between; }
.pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; font-size: 13px; }
.pcard:hover { border-color: var(--axis); }
.pcard .top { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.pcard .why { color: var(--ink-2); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .run { margin-top: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.pcard .progress { margin-top: 3px; }
.feed div { padding: 4px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.feed .t { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; font-size: 12px; }
@media (max-width: 560px) { .tile .value { font-size: 20px; } th, td { padding: 5px 6px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="back" href="/" title="Back to the mini-llm control page">← Control</a>
    <h1>autolab</h1>
    <span id="daemonBadge" class="status"></span>
    <span class="meta" id="meta">loading…</span>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="live">Live</button>
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="programs">Programs</button>
    <button role="tab" data-tab="frontier">Frontier</button>
    <button role="tab" data-tab="research">Research</button>
    <button role="tab" data-tab="experiments">Experiments</button>
    <button role="tab" data-tab="runs">Runs</button>
    <button role="tab" data-tab="notebook">Notebook</button>
    <button role="tab" data-tab="decisions">Decisions</button>
    <button role="tab" data-tab="settings">Settings</button>
  </nav>
</header>
<main id="main">
  <section id="live" hidden></section>
  <section id="overview" hidden></section>
  <section id="programs" hidden></section>
  <section id="frontier" hidden></section>
  <section id="research" hidden></section>
  <section id="experiments" hidden></section>
  <section id="runs" hidden></section>
  <section id="notebook" hidden></section>
  <section id="decisions" hidden></section>
  <section id="settings" hidden></section>
</main>
<dialog id="detail"><div class="head"><strong id="detailTitle"></strong><button id="detailClose">Close</button></div>
  <div class="body" id="detailBody"></div></dialog>

<script>
"use strict";
// Mounted at /autolab on the tailnet: resolve API calls against this page's own path, with or
// without a trailing slash, so they never fall through to the owner's server at /.
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
// ---------- tiny DOM helpers (all data goes in as text nodes) ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid != null) el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
}
const fmt = {
  loss: v => v == null ? "–" : Number(v).toFixed(4),
  usd: v => v == null ? "–" : "$" + Number(v).toFixed(2),
  usd3: v => v == null ? "–" : "$" + Number(v).toFixed(3),
  int: v => v == null ? "–" : Math.round(v).toLocaleString(),
  si: v => { if (v == null) return "–"; const a = Math.abs(v);
    return a >= 1e9 ? (v/1e9).toFixed(2)+"B" : a >= 1e6 ? (v/1e6).toFixed(2)+"M" : a >= 1e3 ? (v/1e3).toFixed(1)+"k" : String(Math.round(v*100)/100); },
  pct: v => v == null ? "–" : (v*100).toFixed(2) + "%",
  dur: v => { if (v == null) return "–"; v = Math.round(v); const m = Math.floor(v/60), sec = v%60;
    return m >= 60 ? Math.floor(m/60)+"h "+(m%60)+"m" : m ? m+"m "+sec+"s" : sec+"s"; },
  ago: v => v == null ? "–" : v < 90 ? Math.round(v)+"s ago" : v < 5400 ? Math.round(v/60)+"m ago" : Math.round(v/3600)+"h ago",
  time: iso => iso ? new Date(iso).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "–",
  val: v => v == null ? "–" : typeof v === "number" ? (Math.abs(v) < 1e-3 && v !== 0 ? v.toExponential(2) : String(Math.round(v*1e6)/1e6)) : typeof v === "object" ? JSON.stringify(v) : String(v),
};
function md(text) {  // `code` spans only; everything stays a text node
  return String(text).split("`").map((part, i) => i % 2 ? h("code", {}, part) : part);
}
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const STATE_STATUS = { finished: ["good", "finished"], pending: ["warning", "running"], failed: ["critical", "failed"] };
function statusEl(kind, text) { return h("span", {class: "status"}, h("i", {style: `background:var(--${kind})`}), text); }

// ---------- charts ----------
function niceTicks(lo, hi, n) {
  if (!(hi > lo)) { hi = lo + 1; }
  const step0 = (hi - lo) / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m*mag).find(st => st >= step0) || step0;
  const out = []; for (let v = Math.ceil(lo/step)*step; v <= hi + step*1e-9; v += step) out.push(+v.toPrecision(12));
  return out;
}
// Charts draw at their real pixel width (no viewBox stretching), so text stays 11px.
function availW(half) {
  const mw = document.getElementById("main").clientWidth - 62;
  return Math.max(280, Math.round(half && mw > 700 ? (mw - 14) / 2 : mw));
}
function attachTip(wrap) { const tip = h("div", {class: "tip", hidden: true}); wrap.appendChild(tip); return tip; }
function placeTip(wrap, tip, px, py) {
  tip.hidden = false; const W = wrap.clientWidth, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(0, px + 12), W - tw) + "px"; tip.style.top = Math.max(0, py - 10) + "px";
}
// series: [{name, color, points:[[x,y],...]}]; opts: {xFmt, yFmt, xTime, step, height}
function lineChart(series, opts = {}) {
  const W = opts.width || availW(opts.half), H = opts.height || 240, m = {l: 52, r: 70, t: 10, b: 26};
  const all = series.flatMap(sr => sr.points).filter(p => p[1] != null && isFinite(p[1]));
  const wrap = h("div", {class: "chart"});
  if (!all.length) { wrap.appendChild(h("p", {class: "muted"}, opts.empty || "No data yet.")); return wrap; }
  if (series.length > 1) wrap.appendChild(h("div", {class: "legend"},
    series.map(sr => h("span", {}, h("span", {class: "key", style: `background:${sr.color}`}), sr.name))));
  let x0 = Math.min(...all.map(p => p[0])), x1 = Math.max(...all.map(p => p[0]));
  let y0 = Math.min(...all.map(p => p[1])), y1 = Math.max(...all.map(p => p[1]));
  if (x1 === x0) x1 = x0 + 1;
  const pad = (y1 - y0) * 0.06 || Math.abs(y1) * 0.05 || 1; y0 -= pad; y1 += pad;
  if (opts.yZero) y0 = 0;
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r), Y = y => H - m.b - (y - y0) / (y1 - y0) * (H - m.t - m.b);
  const svg = s("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": opts.label || "line chart"});
  for (const t of niceTicks(y0, y1, 4)) {
    svg.appendChild(s("line", {x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: cssVar("--grid"), "stroke-width": 1}));
    svg.appendChild(s("text", {x: m.l - 6, y: Y(t) + 4, "text-anchor": "end"}, (opts.yFmt || fmt.val)(t)));
  }
  const xt = opts.xTime ? niceTicks(x0, x1, 3) : niceTicks(x0, x1, 5);
  for (const t of xt) svg.appendChild(s("text", {x: X(t), y: H - 8, "text-anchor": "middle"}, (opts.xFmt || fmt.si)(t)));
  svg.appendChild(s("line", {x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: cssVar("--axis")}));
  for (const sr of series) {
    const pts = sr.points.filter(p => p[1] != null && isFinite(p[1]));
    if (!pts.length) continue;
    let d = "";
    pts.forEach((p, i) => {
      if (i === 0) d += `M${X(p[0])},${Y(p[1])}`;
      else if (opts.step) d += `H${X(p[0])}V${Y(p[1])}`;
      else d += `L${X(p[0])},${Y(p[1])}`;
    });
    svg.appendChild(s("path", {d, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));
    const last = pts[pts.length - 1];
    svg.appendChild(s("circle", {cx: X(last[0]), cy: Y(last[1]), r: 3.5, fill: sr.color, stroke: cssVar("--surface"), "stroke-width": 2}));
    svg.appendChild(s("text", {x: X(last[0]) + 8, y: Y(last[1]) + 4, class: "lbl"}, (opts.yFmt || fmt.val)(last[1])));
  }
  const cross = s("line", {y1: m.t, y2: H - m.b, stroke: cssVar("--axis"), "stroke-width": 1, visibility: "hidden"});
  svg.appendChild(cross);
  const hit = s("rect", {x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent"});
  svg.appendChild(hit);
  wrap.appendChild(svg);
  const tip = attachTip(wrap);
  const xs = [...new Set(all.map(p => p[0]))].sort((a, b) => a - b);
  function move(ev) {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * W;
    const xv = x0 + (sx - m.l) / (W - m.l - m.r) * (x1 - x0);
    let best = xs[0]; for (const x of xs) if (Math.abs(x - xv) < Math.abs(best - xv)) best = x;
    cross.setAttribute("x1", X(best)); cross.setAttribute("x2", X(best)); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(h("div", {class: "muted"}, (opts.xTipFmt || opts.xFmt || fmt.int)(best)));
    for (const sr of series) {
      const p = sr.points.reduce((a, q) => Math.abs(q[0] - best) < Math.abs(a[0] - best) ? q : a, sr.points[0]);
      if (!p) continue;
      tip.appendChild(h("div", {}, h("span", {class: "key", style: `background:${sr.color}`}), h("b", {}, (opts.yFmt || fmt.val)(p[1])), " ",
        h("span", {class: "muted"}, sr.name + (p[2] ? " · " + p[2] : ""))));
    }
    placeTip(wrap, tip, ev.clientX - wrap.getBoundingClientRect().left, ev.clientY - wrap.getBoundingClientRect().top);
  }
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
  return wrap;
}
// Strip plot: rows = categories, dots = values; optional band [lo, hi] and reference line.
function stripChart(rows, opts = {}) {
  const rowH = 30, W = opts.width || availW(opts.half), m = {l: 90, r: 64, t: 8, b: 26}, H = m.t + m.b + rowH * Math.max(1, rows.length);
  const vals = rows.flatMap(r => r.values);
  const wrap = h("div", {class: "chart"});
  if (!vals.length) { wrap.appendChild(h("p", {class: "muted"}, "No finished runs yet.")); return wrap; }
  let x0 = Math.min(...vals, ...(opts.band || [])), x1 = Math.max(...vals, ...(opts.band || []));
  const pad = (x1 - x0) * 0.08 || 0.01; x0 -= pad; x1 += pad;
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r);
  const svg = s("svg", {viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: "img", "aria-label": opts.label || "strip chart"});
  for (const t of niceTicks(x0, x1, 5)) {
    svg.appendChild(s("line", {x1: X(t), x2: X(t), y1: m.t, y2: H - m.b, stroke: cssVar("--grid")}));
    svg.appendChild(s("text", {x: X(t), y: H - 8, "text-anchor": "middle"}, t.toFixed(3)));
  }
  if (opts.band) {
    svg.appendChild(s("rect", {x: X(opts.band[0]), y: m.t, width: Math.max(1, X(opts.band[1]) - X(opts.band[0])), height: H - m.t - m.b, fill: cssVar("--band")}));
  }
  const tip = attachTip(wrap);

function daemonState(d) {
  if (!d) return ["critical", "daemon not running"];
  const act = LIVE && LIVE.current ? LIVE.current.age_s : null;  // busy cycles still record activity
  const age = Math.min(d.age_s ?? 1e9, act ?? 1e9);
  const stale = age > 3 * (d.interval_s || 60) + (d.in_cycle ? 1200 : 0);
  if (stale) return ["critical", "daemon stale · " + fmt.ago(d.age_s)];
  if (d.last_error && (!d.last_ok || d.last_error.at > d.last_ok)) return ["serious", "daemon erroring"];

}

async function refreshFrontier() {
  const el = document.getElementById("frontier");
  let F;
  try { F = await (await fetch(BASE + "api/frontier" + (frontierSession ? "?session=" + encodeURIComponent(frontierSession) : ""), {cache: "no-store"})).json(); } catch (e) { return; }
  el.replaceChildren();
  const sel = h("select", {"aria-label": "session", onchange: e => { frontierSession = e.target.value; refreshFrontier(); }},
    F.sessions.map(n => h("option", {value: n, selected: n === F.session}, n)));
  el.append(h("div", {class: "card"}, h("h3", {}, "Four dimensions, no single winner"),
    h("p", {class: "ink2", style: "margin:4px 0"}, "Every fully evaluated program is measured on quality (full val loss), context capability (copy-at-distance long-range score and effective context), training compute (time for the budget) and inference cost (batch-1 decode latency). A program is on the frontier if no other program is at least as good on all four and better on one; loss differences within seed noise count as ties. Sessions differ in data and budget, so each has its own frontier."),
    h("div", {class: "filters", style: "margin:8px 0 0"}, h("span", {class: "muted"}, "Session"), sel,
      h("span", {class: "muted"}, `${F.measured} of ${F.programs} programs measured · ${F.dataset} @ ${fmt.si(F.tokens)} tokens · ties within ${F.sigma.toFixed(3)} nats · quality champion ${F.incumbent}`))));
  const pts = key => F.rows.map(r => ({x: r[key], y: r.full_mean, label: r.id, on: r.frontier}));
  el.append(h("div", {class: "grid2"},
    h("div", {class: "card"}, h("h3", {}, "Quality vs inference cost"), h("div", {class: "muted", style: "font-size:12px"}, "Down and left is better."),
      scatterChart(pts("decode_ms_per_token"), {xLabel: "decode ms / token (batch 1)", yLabel: "full val loss", xName: "decode", yName: "loss", yFmt: v => Number(v).toFixed(3), xFmt: v => Number(v).toFixed(1), label: "loss vs decode latency"})),
    h("div", {class: "card"}, h("h3", {}, "Quality vs long-context capability"), h("div", {class: "muted", style: "font-size:12px"}, "Down and right is better."),
      scatterChart(pts("long_range_score"), {xLabel: "long-range score (copy at distance)", yLabel: "full val loss", xName: "long-range", yName: "loss", yFmt: v => Number(v).toFixed(3), xFmt: v => Number(v).toFixed(2), label: "loss vs long-range score"}))));
  const cols = ["program", "frontier", "full val (seeds)", "context", "long-range", "effective ctx", "short-ctx loss", "train min", "train tok/s", "decode ms/tok", "prefill ms", "params", "train mem", "infer mem"];
  el.append(h("div", {class: "card scroll"}, F.rows.length ? h("table", {}, h("thead", {}, h("tr", {}, cols.map((c, i) => h("th", {class: i > 1 ? "num" : ""}, c)))),
    h("tbody", {}, F.rows.map(r => h("tr", {class: "click", onclick: () => openProgram(r.id)},
      h("td", {}, h("strong", {}, r.id), r.id === F.incumbent ? h("span", {class: "chip"}, "champion") : null),
      h("td", {}, r.frontier ? statusEl("good", "frontier") : h("span", {class: "muted"}, "dominated")),
      h("td", {class: "num"}, `${fmt.loss(r.full_mean)} (${r.n_seeds})`), h("td", {class: "num"}, r.context ?? "–"),
      h("td", {class: "num"}, r.long_range_score?.toFixed(2)), h("td", {class: "num"}, r.effective_context ?? "–"),
      h("td", {class: "num"}, r.short_context_loss != null ? r.short_context_loss.toFixed(3) : "–"),
      h("td", {class: "num"}, (r.train_wall_s / 60).toFixed(0)), h("td", {class: "num"}, fmt.si(r.train_tokens_per_sec)),
      h("td", {class: "num"}, r.decode_ms_per_token?.toFixed(1)), h("td", {class: "num"}, r.prefill_ms?.toFixed(1)),
      h("td", {class: "num"}, fmt.si(r.params)), h("td", {class: "num"}, r.peak_train_mem_bytes ? (r.peak_train_mem_bytes / 2 ** 30).toFixed(1) + " GiB" : "–"),
      h("td", {class: "num"}, r.peak_inference_mem_bytes ? (r.peak_inference_mem_bytes / 2 ** 20).toFixed(0) + " MiB" : "–"))))) :
    h("p", {class: "muted", style: "margin:0"}, "No program in this session has all four dimensions measured yet. New full-budget runs measure them automatically, and the quality champion gets a measure run.")));
}

async function refreshResearch() {
  const el = document.getElementById("research");
  let R;
  try { R = await (await fetch(BASE + "api/research", {cache: "no-store"})).json(); } catch (e) { return; }
  el.replaceChildren();
  const S = R.state || {};
  el.append(h("div", {class: "card"}, h("h3", {}, "How research works"),
    h("p", {class: "ink2", style: "margin:4px 0"}, "When a program becomes the best (or the search stalls), a research agent with web search audits its code, component by component, for outdated or missing techniques and writes technique cards with sources. Each new card is tested right away by a directed child (\"apply card cN to the incumbent\"); after that, cards are shown to the proposer by how the programs that used them fared. Cards are not pre-approved: their results are the review."),
    h("div", {class: "muted"}, `State: ${S.state || "idle"}` + (S.program ? ` · last audit of ${S.program}` : "") + (S.waiting ? ` · waiting: ${S.waiting}` : "") +
      (S.pending_directed && S.pending_directed.length ? ` · cards waiting for their directed child: ${S.pending_directed.join(", ")}` : "") +
      ` · budget: ${Math.round((R.config.budget_share || 0) * 100)}% of the daily budget · model ${R.config.model || "?"}`)));
  if (!R.cards.length) { el.append(h("p", {class: "muted"}, "No technique cards yet. The first audit runs when the controller next has budget.")); }
  for (const c of R.cards) {
    const st = c.stats || {};
    const out = Object.entries(st.outcomes || {});
    el.append(h("details", {class: "card"},
      h("summary", {style: "cursor:pointer"}, h("strong", {}, `${c.id} · ${c.name}`), " ",
        h("span", {class: "chip"}, c.category), h("span", {class: "chip"}, c.component),
        h("span", {class: "muted", style: "font-size:12px"}, ` for ${c.session}/${c.for_program} · ${fmt.time(c.created)} · used ${st.used || 0}× `),
        out.map(([k, v]) => statusEl(OUTCOME_KIND[k] || "serious", `${k} ${v}`))),
      h("dl", {class: "kv", style: "margin-top:8px"},
        h("dt", {}, "Now"), h("dd", {}, c.current), h("dt", {}, "Proposal"), h("dd", {}, c.proposal),
        h("dt", {}, "Mechanism"), h("dd", {}, c.mechanism), h("dt", {}, "Applicability"), h("dd", {}, c.applicability),
        h("dt", {}, "Expected"), h("dd", {}, c.expected_effect), h("dt", {}, "Risks"), h("dd", {}, c.risks),
        h("dt", {}, "Implementation"), h("dd", {}, c.implementation),
        h("dt", {}, "Evidence"), h("dd", {}, (c.evidence || []).map(e => { const url = safeUrl(e.url);
          return h("div", {}, url ? h("a", {href: url, target: "_blank", rel: "noopener noreferrer"}, e.source) : e.source,
            e.year ? ` (${e.year})` : "", ": ", e.finding); })),
        h("dt", {}, "Programs"), h("dd", {}, (st.programs || []).join(", ") || "none yet"))));
  }
  if (R.runs.length) el.append(h("h2", {}, "Research runs"), h("div", {class: "card feed"}, R.runs.map(e =>
    h("div", {}, h("span", {class: "t"}, fmt.time(e.at)), e.event === "research_started" ? `started: ${e.program} — ${e.trigger}` :
      `done: ${(e.added || []).join(", ") || "no new cards"} · ${fmt.usd(e.cost_usd)} — ${e.summary || ""}`))));
}

async function refreshLive() {
  try {
    const r = await fetch(BASE + "api/live", {cache: "no-store"});
    if (r.ok) { LIVE = await r.json(); renderLive(LIVE); if (DATA) { const [k, txt] = daemonState(DATA.daemon); document.getElementById("daemonBadge").replaceChildren(statusEl(k, txt)); } }
  } catch (e) {}
}

function renderDecisions(D) {
  const el = document.getElementById("decisions"); el.replaceChildren();
  el.append(h("p", {class: "muted"}, "From the decision log in autolab/HANDOFF.md, newest first."));
  const c = h("div", {class: "card"});
  for (const d of D.decisions) c.append(h("div", {class: "decision"}, h("div", {class: "when"}, d.date + (d.tag ? " · " + d.tag : "")), h("div", {}, md(d.text))));
  el.append(c);
}

function flatten(obj, prefix = "") {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) {
    if (v && typeof v === "object" && !Array.isArray(v)) Object.assign(out, flatten(v, prefix + k + "."));
    else out[prefix + k] = v;
  }
  return out;
}
function renderSettings(D) {
  const el = document.getElementById("settings"); el.replaceChildren();
  el.append(h("div", {class: "grid2"},
    h("div", {class: "card"}, h("h3", {}, "autolab/config.toml"), kv(flatten(D.settings.config))),
    h("div", {class: "card"}, h("h3", {}, "src/autolab/thresholds.toml"), h("div", {class: "muted", style: "margin-bottom:6px"}, "Every number the report and diagnosis use."), kv(flatten(D.settings.thresholds)))));
}

function render() {
  const D = DATA; if (!D) return;
  const [dk, dt] = daemonState(D.daemon);
  document.getElementById("daemonBadge").replaceChildren(statusEl(dk, dt));
  document.getElementById("meta").textContent = "updated " + new Date(D.generated_at).toLocaleTimeString();
  renderOverview(D); renderPrograms(D); renderExperiments(D); renderRuns(D); renderNotebook(D); renderDecisions(D); renderSettings(D);
}
async function refresh() {
  const main = document.getElementById("main");
  main.classList.add("stale");
  try {
    const r = await fetch(BASE + "api/overview", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    DATA = await r.json(); render();
  } catch (e) {
    document.getElementById("meta").textContent = "refresh failed (" + e.message + "), retrying";
  } finally { main.classList.remove("stale"); }
}
function showTab(name) {
  if (name === "live") refreshLive();
  if (name === "research") refreshResearch();
  if (name === "frontier") refreshFrontier();
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", b.dataset.tab === name);
  for (const sec of document.querySelectorAll("main > section")) sec.hidden = sec.id !== name;
  try { localStorage.setItem("autolab.tab", name); } catch (e) {}
}
document.getElementById("tabs").addEventListener("click", e => { if (e.target.dataset.tab) { showTab(e.target.dataset.tab); history.replaceState(null, "", "#" + e.target.dataset.tab); } });
document.getElementById("detailClose").addEventListener("click", () => document.getElementById("detail").close());
let initial = location.hash.slice(1);
if (!initial) { try { initial = localStorage.getItem("autolab.tab") || ""; } catch (e) {} }
showTab(["live", "overview", "programs", "frontier", "research", "notebook", "experiments", "runs", "decisions", "settings"].includes(initial) ? initial : "live");
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 200); });
setInterval(() => { if (!document.hidden && !document.getElementById("live").hidden && !document.getElementById("detail").open) refreshLive(); }, 10000);
refresh(); setInterval(() => { if (!document.hidden && !document.getElementById("detail").open) refresh(); }, 30000);
</script>

# Autolab configuration (committed). Paths are relative to the repo root.

[data]
# Frozen, held-out validation set: a copy of ~/dev/wiki-llm/data/data20k/val.pt
# (918,728 tokens, 937 docs, 0 doc overlap with every train file). Never rebuilt.
# sha256 of the .pt file bytes; checked before every run.
frozen_val = "autolab/data/val_frozen.pt"
frozen_val_sha256 = "28b1041acaa527ac6d7e0a464b07115e766c5bf76252ecbc56a8519de02569ee"
# sha256 of the int64 token buffer (what REPO_NOTES quotes as 08f241fde5bc...).
frozen_val_tokens_sha256 = "08f241fde5bc721efd5866041c3b3fc3f785376b15fc38dcdb6b2a24f0629faf"
datasets_dir = "autolab/data/datasets"

[runs]
runs_dir = "autolab/runs"

[gpu]
# The owner's queue runner trains on the same Mac. A heartbeat updated less
# than `stale_after_s` ago without "finished": true means the GPU is busy.
owner_runs_dir = "~/dev/wiki-llm/runs"
stale_after_s = 120
poll_s = 60
# Consecutive idle checks (poll_s apart) required before starting, so we don't
# slip into the gap between two queued jobs.
idle_checks_required = 2

[modal]
# Autolab's own app and volumes: the owner's mirror watches wiki-llm-runs and
# imports finished runs into his baselines, so autolab never writes there.
app_name = "autolab-train"
runs_volume = "autolab-runs"
data_volume = "autolab-data"
default_gpu = "L4"
max_containers = 8          # parallel trials
max_usd = 50.0              # refuse submits once spent + committed estimate would exceed this (owner, 2026-09-27)
# $/sec per GPU (modal.com/pricing, 2026-09-26, via the owner's README). CPU/memory
# charges come on top and aren't counted, so treat totals as a lower bound.
[modal.gpu_usd_per_s]
T4 = 0.000164
L4 = 0.000222
L40S = 0.000542
"A100-40GB" = 0.000583
"A100-80GB" = 0.000694
H100 = 0.001097

[evolve]
# The evaluator `h` (HANDOFF M3). Fixed for a session: data, frozen val, block_size,
# token budgets, eval settings, GPU type. Everything else is the program.
gpu = "L4"
dataset_id = "data20k"
block_size = 128
screen_tokens = 5242880      # 640 steps at bs64 x blk128
full_tokens = 20971520       # 2560 steps, ~1 epoch of data20k
wall_cap_mult = 3.0          # per-stage wall-clock cap = this x the initial program's wall time. A safety cap
                             # since M8: training compute is its own dimension, so a slower program should
                             # still train the full budget and be judged on quality AND cost, not truncated
screen_margin = 0.25         # screen must be <= incumbent screen mean + this; wide because screens penalize
                             # regularization (dropout/wd) that pays off only after several epochs (owner, 2026-09-27)
confirm_seeds = [2, 3]       # extra seeds for a full-budget result that beats the incumbent...
confirm_trigger_sigma = 0.5  # ...by at least this x the full seed std (owner: 0.5σ, 2026-09-27)
accept_sigma = 2.0           # accept iff mean over >= 2 seeds < incumbent mean - accept_sigma x full seed std
noise_floor = 0.02           # the std used for decisions is max(measured, this): a 3-seed std can come out far
                             # too small (0.0069 at 122M vs 0.031-0.043 elsewhere), making the accept bar too shallow
param_cap_mult = 1.5         # reject programs above this x the initial program's parameter count
throughput_floor = 0.2       # reject screens slower than this x the initial program's tokens/sec (catastrophic only)
cpu_tests = ["tests"]        # pytest paths run against every candidate (protected, from this checkout)
# Pins plain AdamW bit for bit, i.e. freezes the evolvable optimizer region; replaced by
# tests/autolab/test_loop_equivalence.py, which checks the same thing with the program's own optimizer.
cpu_test_deselect = ["tests/test_ddp.py::test_single_process_matches_plain_loop"]
cpu_test_timeout_s = 900

[evolve.eval]
eval_interval = 50
eval_batches = 20
eval_seed = 1234
log_interval = 10
full_eval_interval = 0
control_poll = 25

# Evolvable hyperparameters and their allowed ranges (block_size and budgets are fixed).
[evolve.hparams]
lr = { min = 1e-5, max = 1e-2 }
min_lr = { min = 0.0, max = 1e-3 }
warmup_steps = { min = 0, max = 2000, int = true }
weight_decay = { min = 0.0, max = 0.5 }
dropout = { min = 0.0, max = 0.3 }
batch_size = { choices = [8, 16, 32, 64, 128] }
# M8: context length is a program dimension; batch_size x block_size must equal the session's tokens per
# update (8192), so 128x64, 256x32, 512x16, 1024x8 (owner: up to 1024, 2026-09-28)
block_size = { choices = [128, 256, 512, 1024] }
n_embd = { choices = [128, 192, 256, 320, 384, 512] }
n_head = { choices = [1, 2, 4, 8] }
n_layer = { min = 1, max = 12, int = true }

# Program database (AlphaEvolve's MAP-Elites + islands, scaled down to tens of programs).
[evolve.database]
n_islands = 2
p_exploit = 0.5              # parent = island's best with this prob., else a random elite cell
top_inspirations = 2         # best programs shown as "prior programs" in the prompt
diverse_inspirations = 1     # plus random elites from other cells
migrate_every = 6            # after this many finished children, copy each island's best to the others
params_bins = [12e6, 16e6, 20e6]          # MAP-Elites descriptor 1: parameter count
tokens_per_sec_bins = [30e3, 38e3, 45e3]  # descriptor 2: training throughput (L4)
recent_failures = 5          # rejected children shown in the prompt, with reasons
history = 60                 # cap on the "what has been tried" list (regime-scoped, see [evolve.memory])
decode_ms_bins = [5.0, 10.0, 20.0]  # M8 MAP-Elites descriptor (with context length): decode latency buckets
p_frontier = 0.3             # M8: chance a parent is drawn from the Pareto frontier
quality_tol = 0.02           # M8: loss differences within this count as ties on the frontier (≈ 1 σ)

# Regime-scoped memory of rejections (autolab.memory; owner, 2026-09-29). A rejection stops suppressing its
# idea after regime changes (a new session: data switch or compute ladder), not after a time: bugs (failed
# before training) never count against the idea; screen rejections last until the next regime change; full-run
# failures are strong in their regime, weak one change later, gone after two; near misses are never suppressed.
[evolve.memory]
near_miss_sigma = 2.0        # a full-run result within this x σ of the incumbent then (or a contender) is a near miss
retest_per_regime = 3        # near misses from earlier regimes re-applied to the new champion after each regime change
card_decay = 0.5             # a card's bandit record counts this^(regime changes since) per outcome

[llm]
claude_bin = "~/.local/bin/claude"
timeout_s = 600
# Model mix: evaluations (minutes of GPU) dwarf LLM latency, so lean on the strongest model.
models = { opus = 0.8, sonnet = 0.2 }
# Meta-prompt evolution (scaled down): each instruction's chance = its weight below x its children's mean
# reward (accepted 1, contender 0.6, evaluated 0.3, rejected 0), shrunk toward the overall mean and decayed per
# regime change like the card bandit. false = the fixed weights only.
instruction_bandit = true
# Stochastic formatting: the task instruction varies across calls, with these weights (the bandit's prior).
[llm.instructions]
open = 1.0
diagnosis = 1.0
optimization = 1.0
architecture = 1.0
simplify = 0.3
context = 1.0      # M8: longer usable context without much more inference cost
efficiency = 1.0   # M8: cheaper training or inference at equal quality

[datasets]
seed = 0                     # prepare_dataset shuffle seed (the CLI default; data20k's was not recorded)
max_total_gb = 5.0           # disk cap for autolab/data/datasets
reference = "data20k"        # a bigger build should contain this (checked, not assumed)

# The controller (M5): what the daemon proposes on its own. `autolab start` enables it.
[controller]
daily_usd = 10.0                  # rolling-24h budget: Modal (actual + committed) + Claude (owner, 2026-09-27)
max_in_flight = 6                 # unfinished programs at once (owner: more proposals, 2026-09-28)
max_programs_per_session = 200
max_consecutive_early_rejects = 4 # this many rejected before training in a row -> pause 6 h
p_full = 0.5                      # for the expected cost of one candidate
llm_usd_per_call = 0.15
data_trigger_confidence = 0.75    # incumbent data_limited at least this confident -> try more data
data_growth = 2                   # next dataset = this x the current number of documents
commit_accepted = true            # accepted programs -> branch autolab-accepted (own worktree)
push_accepted = true              # ...and push it to origin after each acceptance (owner, 2026-09-28; never forced)
# Compute ladder: when search at this budget stalls, test the incumbent at ladder_factor x tokens
# (3 seeds); if it beats the incumbent by > accept_sigma x noise, open a session at that budget.
ladder = true
ladder_factor = 1.5
ladder_patience = 4               # finished children since the last acceptance that didn't beat it
max_full_tokens = 122880000       # owner's current regime: bs64 x 15k steps. Raise to let it climb further.
ablation_max_in_flight = 2        # no-evolution control arm (autolab ablation start): unfinished candidates at once

# Research (M7): a web-enabled agent audits the current winner for outdated or missing techniques and
# writes technique cards (autolab/research/cards.jsonl); each new card gets a directed child, and cards
# are sampled into proposer prompts by how their programs fared.
[research]
enabled = true
budget_share = 0.3          # research may use this share of the (possibly raised) daily budget (owner, 2026-09-28)
model = "opus"
est_usd_per_run = 1.5       # for the budget check before a run
timeout_s = 1500
max_searches = 8
max_cards = 5
cards_in_prompt = 3         # cards sampled (UCB over outcomes) into each regular proposal
directed_per_card = 1       # children that apply a new card to the incumbent right away
stall_patience = 6          # also research when this many children since the last acceptance didn't win

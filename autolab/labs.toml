# Labs: autolab's loop on other problems (src/labs/). Read by the labs daemon every cycle.

[labs]
daily_usd = 10.0           # rolling-24h Claude budget shared by all labs, separate from autolab's (owner, 2026-10-14)
est_call_usd = 0.3         # expected cost of one proposal; a call starts only if it fits

[llm]
claude_bin = "~/.local/bin/claude"
model = "opus"
timeout_s = 600

[infer]
checkpoint = "e768h12l8-rope-95m.pt"   # under autolab/data/labs/infer/: the owner's best 95M (rope, fused), weights only
val = "val.pt"                          # autolab's frozen val tokens (the quality windows)
max_delta_loss = 0.005     # nats over the fp32 reference, teacher-forced (fp16/bf16 allowed: owner, 2026-10-14)
min_top1 = 0.97            # top-1 agreement with the reference's argmax
max_mem_mult = 1.5         # peak device memory vs p0's
bench_rounds = 12          # per bench stage (6 order-alternated pairs); confirm adds as many
min_gain = 0.02            # accept at >= exp(0.02) = 1.02x the incumbent...
accept_se = 2.0            # ...and mean - 2 SE > 0 over all round pairs
max_scenario_regression = 0.10   # no scenario may run below 0.90x the incumbent (a default; owner may change)
quality_timeout_s = 900
bench_timeout_s = 1800
max_code_bytes = 40000

[decode]
generator = "e768h12l8-rope-95m.pt"     # under autolab/data/labs/infer/: the same 95M as labs.infer
judge = "judge-fw70edu30-95m.pt"        # under autolab/data/labs/decode/: the owner's 95M on the 70/30 FineWeb/Edu mix
val = "val.pt"                          # autolab/data/labs/infer/val.pt: prompts are val documents' first 32 tokens
min_tokens = 64            # a sample that stops at EOS sooner counts as degenerate
screen_n = 100             # paired prompts in the screen ...
full_n = 300               # ... and in the full stage (pooled with the screen)
min_gain = 0.02            # accept at a >= 2-point drop in the degenerate rate ...
accept_z = 2.0             # ... at >= 2 standard errors (paired)
max_judge_excess = 0.0     # judge loss on generated text <= judge loss on real text + this
max_topic_drop = 0.03      # topic retention >= the incumbent's - this
max_sampler_ms = 2.0       # sampler time per token
saturated_rate = 0.005     # stop proposing once the incumbent degenerates this rarely (nothing left to accept)
val_timeout_s = 2400

[pack]
n = 26                     # circles in the unit square; the published benchmark
deadline_s = 240           # per program run (killed 60 s later)
min_gain = 1e-7            # accept above the incumbent's score + this
contender_gap = 0.01       # valid packings this close to the incumbent stay parents
max_programs = 20          # a finite calibration run; capped after p1 hit 2.635977 on the first proposal (saturated)
